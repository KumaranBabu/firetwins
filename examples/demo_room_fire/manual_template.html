<title>Demo Room Fire Manual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
/* Layout: a single reading column with a step rail; figures break out to a wider measure. */
:root {
  --bg: #fbfaf8;
  --surface: #f2efe9;
  --ink: #1d2327;
  --muted: #5d676d;
  --rule: #d9d4ca;
  --heat: #c2410c;
  --heat-soft: #fde9dc;
  --ok: #2f6b3f;
  --ok-soft: #e1f0e4;
  --warn: #8a5a00;
  --warn-soft: #fbefcf;
  --code-bg: #20262b;
  --code-fg: #e9e4d8;
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15191c; --surface: #1d2327; --ink: #e8e5de; --muted: #9aa5ab; --rule: #333c41;
    --heat: #fb923c; --heat-soft: #3a2415; --ok: #7bc48b; --ok-soft: #1c2e21; --warn: #e8b84a; --warn-soft: #33290f;
    --code-bg: #0f1315; --code-fg: #e0dbcf; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15191c; --surface: #1d2327; --ink: #e8e5de; --muted: #9aa5ab; --rule: #333c41;
  --heat: #fb923c; --heat-soft: #3a2415; --ok: #7bc48b; --ok-soft: #1c2e21; --warn: #e8b84a; --warn-soft: #33290f;
  --code-bg: #0f1315; --code-fg: #e0dbcf; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.6 var(--font-body); padding-inline: 16px; padding-block: 0 64px; margin: 0; }
.wrap { max-width: 760px; margin-inline: auto; }
.wide { max-width: 1000px; margin-inline: auto; }
a { color: var(--heat); }
h1, h2, h3 { text-wrap: balance; line-height: 1.2; }
h1 { font: 600 clamp(2rem, 5vw, 3rem)/1.1 var(--font-display); margin: 0 0 12px; letter-spacing: -0.01em; }
h2 { font: 600 1.7rem/1.2 var(--font-display); margin: 56px 0 12px; padding-top: 24px; border-top: 1px solid var(--rule); }
h3 { font: 600 1.05rem/1.3 var(--font-body); margin: 28px 0 6px; }
p { margin: 0 0 14px; }
code { font: 400 0.88em var(--font-mono); background: var(--surface); padding: 1px 5px; border-radius: 3px; }
pre { background: var(--code-bg); color: var(--code-fg); font: 400 13px/1.55 var(--font-mono); padding: 14px 16px; border-radius: 4px; overflow-x: auto; margin: 10px 0 18px; }
pre code { background: none; padding: 0; font-size: inherit; }
.cover { padding-block: 40px 28px; }
.eyebrow { font: 500 12px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--heat); margin-bottom: 14px; }
.lede { font-size: 1.15rem; color: var(--muted); max-width: 60ch; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 22px; font: 400 13px var(--font-mono); color: var(--muted); margin-top: 18px; }
nav.toc { background: var(--surface); border-radius: 4px; padding: 14px 18px; margin: 24px 0 0; }
nav.toc ol { margin: 6px 0 0; padding-left: 20px; columns: 2; column-gap: 28px; font-size: .95rem; }
nav.toc li { break-inside: avoid; margin-bottom: 3px; }
nav.toc strong { font: 500 12px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.glance { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin: 22px 0; }
.glance div { border: 1px solid var(--rule); border-radius: 4px; padding: 12px 14px; min-width: 0; }
.glance b { display: block; font: 600 1.7rem/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.glance span { font-size: .85rem; color: var(--muted); }
.glance .hot b { color: var(--heat); }
table { border-collapse: collapse; width: 100%; font-size: .94rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 12px 8px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font: 500 12px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.scroll { overflow-x: auto; }
.step { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 0 14px; margin-top: 8px; }
.step .n { font: 600 1.6rem/1 var(--font-display); color: var(--heat); padding-top: 4px; }
.step h3 { margin-top: 0; font-size: 1.15rem; }
.you, .sees { font-size: .9rem; margin-bottom: 8px; }
.tag { display: inline-block; font: 500 11px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; padding: 4px 7px; border-radius: 3px; margin-right: 8px; background: var(--surface); color: var(--muted); }
.tag.check { background: var(--ok-soft); color: var(--ok); }
.note { border-radius: 4px; padding: 12px 16px; margin: 16px 0; font-size: .95rem; }
.note.ok { background: var(--ok-soft); }
.note.warn { background: var(--warn-soft); }
.note.heat { background: var(--heat-soft); }
.note b:first-child { display: block; margin-bottom: 2px; }
figure { margin: 22px 0; }
figure img { display: block; width: 100%; height: auto; border: 1px solid var(--rule); border-radius: 4px; background: #fff; }
figcaption { font-size: .88rem; color: var(--muted); margin-top: 8px; max-width: 70ch; }
.figrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.figrow figure { margin: 0; }
.shots { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.shots figure { margin: 0; }
ul.plain { padding-left: 20px; }
ul.plain li { margin-bottom: 6px; }
.files td:first-child { font-family: var(--font-mono); font-size: .85rem; white-space: nowrap; padding-right: 18px; }
footer { margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--rule); font-size: .85rem; color: var(--muted); }
@media (max-width: 560px) { nav.toc ol { columns: 1; } .step { grid-template-columns: 30px minmax(0, 1fr); gap: 0 10px; } }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<div class="wrap cover"></div>
<!-- Only the <head> and <style> above are used: make_manual.py and make_manual_post.py take everything before the cover. -->
</body>
</html>
